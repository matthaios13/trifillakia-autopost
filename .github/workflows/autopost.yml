name: Trifillakia autopost

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = κανονικά, preview = κάρτες δείγματα, dry = δοκιμή χωρίς ανάρτηση, check = έλεγχος σύνδεσης Meta"
        default: run
        type: choice
        options: [run, preview, dry, check, delete]
      ids:
        description: "Μόνο για delete: IDs αναρτήσεων Facebook, χωρισμένα με κόμμα"
        default: ""
        type: string

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "trifillakia-bot"
          git config user.email "trifillakia-bot@users.noreply.github.com"

      - name: Run
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.mode == 'dry' && '1' || '0' }}
        run: |
          if [ "${{ inputs.mode }}" = "preview" ]; then
            python -m bot preview
          elif [ "${{ inputs.mode }}" = "check" ]; then
            python -m bot check
          elif [ "${{ inputs.mode }}" = "delete" ]; then
            python -m bot delete "${{ inputs.ids }}"
          else
            python -m bot run
          fi

      # Το Drupal του trifillakia τρέχει cron μόνο μία φορά την ώρα: το «ξυπνάμε» κάθε ~15 λεπτά
      # ώστε οι importers «PAO news» και «ELABET άρθρα» να παίρνουν τα νέα άρθρα γρήγορα.
      # DRUPAL_CRON_URL = το link «To run cron from outside the site» από Configuration → System → Cron.
      - name: Trifillakia cron
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'run') }}
        env:
          DRUPAL_CRON_URL: ${{ secrets.DRUPAL_CRON_URL }}
        run: |
          if [ -n "$DRUPAL_CRON_URL" ] && [ $(( 10#$(date -u +%M) % 15 )) -lt 5 ]; then
            curl -s -o /dev/null -w "trifillakia cron: %{http_code} σε %{time_total}s\n" --max-time 120 "$DRUPAL_CRON_URL" || true
          fi

      - name: Cards
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

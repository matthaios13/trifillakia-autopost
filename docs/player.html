<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003a20">
<title>PAO Radio · Trifillakia.gr</title>
<link rel="icon" href="https://paoradio.gr/wp-content/uploads/2023/11/cropped-PAO_Radio_Social-01-01-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#8BD448;--d:#003a20}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 85% 0%,rgba(139,212,72,.28),transparent 50%),linear-gradient(160deg,#006b3d,#002414 75%);display:flex;flex-direction:column;align-items:center;padding:22px 20px calc(18px + env(safe-area-inset-bottom));overflow-x:hidden}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top img{height:30px}
.top a{color:rgba(255,255,255,.75);font:800 12px Manrope,Arial,sans-serif;text-decoration:none;padding:6px 10px;border:1px solid rgba(255,255,255,.25);border-radius:999px}
.art{position:relative;margin:22px auto 18px;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;background:url(https://paoradio.gr/wp-content/uploads/2023/11/cropped-PAO_Radio_Social-01-01-270x270.png) center/cover,#003a20;box-shadow:0 0 0 10px rgba(139,212,72,.12),0 18px 50px rgba(0,0,0,.45)}
.on .art{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kick{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--g);font:800 11.5px Manrope,Arial,sans-serif;letter-spacing:1.4px}
.kick i{width:8px;height:8px;border-radius:50%;background:#ff3355;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,51,85,.6)}70%{box-shadow:0 0 0 8px rgba(255,51,85,0)}100%{box-shadow:0 0 0 0 rgba(255,51,85,0)}}
h1{margin:8px 0 4px;text-align:center;font:800 22px/1.25 Manrope,Arial,sans-serif}
.song{min-height:40px;text-align:center;color:rgba(255,255,255,.8);font:600 14px/1.45 Manrope,Arial,sans-serif}
.ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 10px}
.play{width:78px;height:78px;border-radius:50%;border:0;background:var(--g);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.35);transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:32px;height:32px;fill:var(--d)}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px;width:24px;opacity:0}
.on .eq{opacity:1}
.eq i{flex:1;background:var(--g);border-radius:2px;height:5px}
.on .eq i{animation:q 1s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}.eq i:nth-child(4){animation-delay:.6s!important}
@keyframes q{0%,100%{height:5px}50%{height:20px}}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;color:rgba(255,255,255,.7);font:700 12px Manrope,Arial,sans-serif}
.vol input{width:160px;accent-color:var(--g)}
.card{margin-top:18px;padding:13px 15px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(139,212,72,.28);font:700 13.5px/1.45 Manrope,Arial,sans-serif}
.card small{display:block;margin-bottom:3px;color:var(--g);font:800 10.5px Manrope,Arial,sans-serif;letter-spacing:1px}
.card button{margin-top:9px;padding:8px 12px;border-radius:10px;border:0;background:var(--g);color:var(--d);font:800 12.5px Manrope,Arial,sans-serif;cursor:pointer}
.vid{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.foot{margin-top:auto;padding-top:16px;text-align:center;color:rgba(255,255,255,.55);font:600 11.5px Manrope,Arial,sans-serif}
.foot a{color:var(--g);text-decoration:none;font-weight:800}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w" id="w">
 <div class="top"><img src="https://paoradio.gr/wp-content/uploads/2023/11/PAO_Radio-01.png" alt="PAO Radio"><a href="https://www.trifillakia.gr/radio" target="trifillakia">Πρόγραμμα ›</a></div>
 <div class="art" aria-hidden="true"></div>
 <div class="kick"><i></i>ΣΤΟΝ ΑΕΡΑ</div>
 <h1 id="now">PAO Radio</h1>
 <div class="song" id="song">Πάτα ▶︎ για να ακούσεις</div>
 <div class="ctl"><span class="eq"><i></i><i></i><i></i><i></i></span><button class="play" id="play" aria-label="Αναπαραγωγή"></button><span class="eq"><i></i><i></i><i></i><i></i></span></div>
 <div class="vol"><span>Ένταση</span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Ένταση"></div>
 <div class="card" id="show" hidden></div>
 <div class="vid" id="vid" hidden></div>
 <div class="card" id="next" hidden></div>
 <div class="foot">Κράτα το παράθυρο ανοιχτό και συνέχισε στο <a href="https://www.trifillakia.gr/" target="trifillakia">trifillakia.gr</a></div>
</div>
<script>
(function(){
var STREAM='https://s32.radiolize.com:8010/radio.mp3',STATUS='https://s32.radiolize.com:8010/status-json.xsl',TZ='Europe/Athens';
var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>';
var $=function(i){return document.getElementById(i)},a=new Audio(),rows=[],song='';
a.preload='none';a.volume=.8;
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hm(t){return new Date(t*1000).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ})}
function dk(t){return new Date(t*1000).toLocaleDateString('en-CA',{timeZone:TZ})}
function day(t){var n=Date.now()/1000;return dk(t)===dk(n)?'σήμερα':dk(t)===dk(n+86400)?'αύριο':new Date(t*1000).toLocaleDateString('el-GR',{weekday:'long',timeZone:TZ})}
function ui(){var on=!a.paused;document.body.classList.toggle('on',on);$('play').innerHTML=on?PAUSE:PLAY;$('play').setAttribute('aria-label',on?'Παύση':'Αναπαραγωγή');if('mediaSession' in navigator)navigator.mediaSession.playbackState=on?'playing':'paused'}
function play(){stopVid();a.src=STREAM+'?t='+Date.now();a.play().then(ui).catch(function(){$('song').textContent='Δεν ξεκίνησε η αναπαραγωγή, πάτα ξανά ▶︎';ui()})}
function pause(){a.pause();a.removeAttribute('src');a.load();ui()}
$('play').addEventListener('click',function(){a.paused?play():pause()});
$('vol').addEventListener('input',function(){a.volume=this.value/100});
a.addEventListener('playing',ui);a.addEventListener('pause',ui);
a.addEventListener('error',function(){if(document.body.classList.contains('on'))setTimeout(play,3000)});
function meta(){if(!('mediaSession' in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:song||'PAO Radio',artist:'PAO Radio · Trifillakia.gr',artwork:[{src:'https://paoradio.gr/wp-content/uploads/2023/11/cropped-PAO_Radio_Social-01-01-270x270.png',sizes:'270x270',type:'image/png'}]});
 navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',pause)}
function cur(){var n=Date.now()/1000;return rows.filter(function(r){return r[0]<=n&&n<r[1]})[0]}
function nxt(){var n=Date.now()/1000;return rows.filter(function(r){return r[0]>n&&r[4]!=='music'})[0]}
function stopVid(){$('vid').innerHTML='';$('vid').hidden=true}
function prog(){var c=cur(),x=nxt(),s=$('show');
 if(c&&c[4]!=='music'&&c[5]){s.hidden=false;s.innerHTML='<small>'+(c[4]==='live'?'LIVE ΤΩΡΑ':'ΕΚΠΟΜΠΗ ΤΩΡΑ · ΕΠΑΝΑΛΗΨΗ')+' · '+hm(c[0])+'–'+hm(c[1])+'</small>'+e(c[2])+(c[3]?' – '+e(c[3]):'')+'<br><button type="button" id="watch">▶︎ Δες την εκπομπή</button>';
  $('watch').onclick=function(){pause();var st=c[4]==='live'?0:Math.max(0,Math.floor(Date.now()/1000-c[0]));$('vid').hidden=false;$('vid').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+e(c[5])+'?autoplay=1&rel=0&playsinline=1&start='+st+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}}
 else s.hidden=true;
 var nx=$('next');if(x){nx.hidden=false;nx.innerHTML='<small>ΑΚΟΛΟΥΘΕΙ · '+e(day(x[0]))+' '+hm(x[0])+'</small>'+e(x[2])+(x[3]?' – '+e(x[3]):'')}else nx.hidden=true;
 $('now').textContent=c&&c[4]!=='music'?c[2]:'PAO Radio'}
function status(){fetch(STATUS,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var s=j&&j.icestats&&j.icestats.source;if(s&&s.length)s=s[0];var t=s?(s.yp_currently_playing||[s.artist,s.title].filter(Boolean).join(' – ')):'';if(t&&t!==song){song=t;meta()}if(song)$('song').textContent='♫ '+song}).catch(function(){})}
function load(){fetch('radio.json?t='+Math.floor(Date.now()/300000)).then(function(r){return r.json()}).then(function(d){rows=d.rows||[];if(d.stream)STREAM=d.stream;prog()}).catch(function(){})}
ui();meta();load();status();setInterval(status,20000);setInterval(prog,30000);setInterval(load,600000);
/* από το κουμπί του site: ξεκινάει μόνο του (το κλικ του χρήστη το επιτρέπει στους περισσότερους browsers) */
if(/[?&]autoplay=1/.test(location.search))play();
})();
</script>
</body>
</html>
